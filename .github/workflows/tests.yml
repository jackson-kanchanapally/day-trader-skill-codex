name: Paper research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t trader-paper:test .
      - run: >-
          docker run --rm --network none --read-only --tmpfs /tmp trader-paper:test
          analyze DEMO.NS --csv /app/examples/synthetic.csv
          --as-of 2026-10-19T09:35:00+05:30 --tick 0.05

name: Paper research checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --prefix dashboard
      - run: npm run build --prefix dashboard
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/build_release.py --check
      - run: python scripts/build_release.py --archive
      - run: python -m unittest discover -s tests
        working-directory: dist/day-trader-skill-public
      - run: >-
          python -m india analyze DEMO.NS
          --csv tests/fixtures/india/synthetic.csv
          --as-of 2026-10-19T09:35:00+05:30 --tick 0.05
        working-directory: dist/day-trader-skill-public
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t trader-paper:test .
      - run: >-
          docker run --rm --network none --read-only --tmpfs /tmp trader-paper:test
          analyze DEMO.NS --csv /app/examples/synthetic.csv
          --as-of 2026-10-19T09:35:00+05:30 --tick 0.05

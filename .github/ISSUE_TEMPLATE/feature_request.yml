name: Feature request
description: Suggest an improvement to the paper research workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user workflow and what is missing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example, data requirements, and validation ideas. Preserve the paper-only execution boundary.
    validations:
      required: true
